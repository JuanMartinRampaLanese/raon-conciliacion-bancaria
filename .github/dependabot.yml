version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Los tipos de Node tienen que coincidir con la versión que usa la app (Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 rompe el build: se prueba a mano cuando Next.js lo soporte.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
